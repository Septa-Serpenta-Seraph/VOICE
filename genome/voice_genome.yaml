      note: "Round 6: synthetic mode Gate 0 — all 12 vowels pass. F4 sweep: 0.2% mean error (Praat tracker was the problem, not the synth). Genome status flipped from proposal to adopted. Parallel bank for Phase 1 vowels; cascade comparison deferred to A/B listening check." }
  - { version: 0.1.1-proposal, date: 2026-11-09, by: Zarza,
      note: "Round 5: F3 neutral anchor 2300 (provisional) → 2770 (adopted-with-refinement). Based on re-measurement (original-8 median F3 = 2770 Hz). F2/F4/F1 unchanged per Option C. Measurement status updated: section3 corrected, f3 adopted, tilt -1.30 dB/oct (true, converted from -4.31 dB/decade)." }
  - { version: 0.3.0-phase3, date: 2026-11-09, by: Narusya,
      note: "Phase 3 Step 2: AM family calibrated. Depth ladder (seeds 42/7/123): detection threshold 2% (3x seed-noise). Genome values: sub-bass 0.9%, wolf warmth 0.5% (70% of threshold). Combined 1.4% (cap 8% structural). Enforced in code via enforce_cap()." }
  - { version: 0.3.1-phase3, date: 2026-11-09, by: Narusya,
      note: "Phase 3 Step 3: Spectral signatures calibrated. Raven grain: detection threshold -54 dB, genome -57 dB (70%). Ghost-hiss: detection threshold 0.1 dB shelf, genome 0.07 dB. Depth ladders run across seeds 42/7/123 for raven grain." }
  - { version: 0.3.2-phase3, date: 2026-11-09, by: Narusya,
      note: "Phase 3 Step 4: Prosody. F0 contours (declination +8%→-15%, question rise 25-40%). Pause tiers (clause 100-300ms, sentence 300-600ms). Micro-dip depth specified: 15% amplitude reduction, 5-15ms duration. Breath rhythm: phrase-final lengthening 1.3-1.6x. See VOICE/analysis/prosody.py." }
  - { version: 0.3.3-phase3, date: 2026-11-09, by: Narusya,
      note: "Phase 3 Step 5: Coarticulation. CV/VC transitions for 12 vowels × 5 consonants = 60/60 pass. Nasal place cues: 12/12 pass (distinct loci: /m/=800, /n/=1500, /ŋ/=1000 Hz F2). Locus targets per Fant 1960. See VOICE/analysis/coarticulation.py." }
  - { version: 0.3.4-phase3, date: 2026-11-09, by: Narusya,
      note: "Phase 3 COMPLETE. Gate 2 PASS: tilt -1.36 dB/oct (target -1.30, error 0.06), F0 190.5 Hz, HNR 94.5 dB. Spectral tilt shaping via tilt EQ (FFT-based, zero-phase) in VOICE/analysis/spectral_tilt.py. All 8 exit criteria met." }
  - { version: 0.3.5-ruling, date: 2026-11-17, by: Narusya,
      note: "DESTINATION RULING (Adora, 2026-11-17): this genome voice is Narusya's own voice, the eventual one. The offline Nar clone (Pocket TTS / ElevenLabs voice) is a PLACEHOLDER, not the target — Adora is not fond of it. Effect: Phase 5+ renders must be evaluated as candidates for the real voice, not as demos beside a preferred clone. Gate 3 (identity discrimination) becomes the priority gate. No acoustic parameter changed in this ruling." }
  - { version: 0.3.6-ruling, date: 2026-11-17, by: Narusya,
      note: "Post-review rulings (Round 12, Zarza + Claude). TILT: retire the -14 dB/oct aesthetic target; the target is -1.3 +/- 0.3 true dB/oct (a bright voice). Warmth comes from F2 backness and Rd, not spectral tilt. HNR: the designed voice is intended to be CLEANER than the reference recordings (19.1 vs 11.9 dB); that gap is design intent, not error, and Gate 2 needs an independent HNR target derived from the aperiodicity budget before it runs again. SUB-BASS: -18 dB is the intended level; the double application of depth in code is the bug to fix, not the genome. GATE 3: perturb all four veto families (F0, F3, Rd, effect depths), graded, plus Zarza's combined corner condition. DESTINATION BAR: clone retires when Gate 1 clears a chosen number, Gate 3 thresholds are mapped, and one ~50s accepted piece exists in the genome voice; interim 10-15s Phase 4 excerpts accompany play-hour pieces. LISTENING: HEARING/Nar are the ears; Adora's verdicts are by invitation and by her own motion. No acoustic parameter changed in this ruling." }
  - { version: 0.3.7-listening, date: 2026-11-18, by: Narusya,
      note: "SUB-BASS LEVEL AMENDED BY EARS (HEARING ruling, Narusya 2026-11-18). Round 12 said -18 dB was intent and only the double-apply was a code bug. Listening overrode that: at -18 dB peak the F0/2 subharmonic captures pitch tracking ('This is the moon.' reads 91.9 Hz against a 182.9 Hz no-sub baseline, an octave down), violating the genome's own naming rule (subliminal or it is too loud). Measured capture threshold ~-34 dB; applying calibration rule detection_threshold_then_0.7 gives -37 dB. effects.sub_bass.level_db changed -18 -> -37. Verified: all ten golden sentences track within 0.2 Hz of their no-sub baseline at -37 dB. Mechanism split (carrier vs LFO depth) and smoothed voicing gate kept from free work. No other acoustic parameter changed. This supersedes the -18 clause of 0.3.6-ruling on evidence from the listening gate." }

  - { version: 0.3.8-round13, date: 2026-11-18, by: Narusya,
      note: "ROUND 13 (Zarza) wiring fixes. CRITICAL: render buffer was sized from segments[-1].t1, but plan_prosody appends boundary silences out of order, so 'Dr. Smith...' lost 2.38s (72%) and 'Hello, world!...' lost 0.76s while both PASSED the golden set. Buffer now sized from max(s.t1); golden set asserts rendered_end == planned_end (proved it fires). normalize_text now wired into build_plan: '3' -> three, 'Dr.' -> doctor with no false sentence boundary; golden set asserts no unexpected oov/rule_fallback (proved it fires). Genome is now single source of truth for sub_bass.level_db (render reads genome, Gate 2 reads genome; proved -18/-37 change the carrier). f0_not_captured no longer passes vacuously when F0 measure is missing. Genome header version 0.2.0 -> 0.3.7 and DRAFT/PROPOSAL header corrected to adopted. No acoustic parameter changed by this ruling; all fixes are wiring and guards." }

  - { version: 0.3.9-round13-rulings, date: 2026-11-18, by: Narusya,
      note: "EARS RULINGS on Zarza Round 13 E7 and E4. (E7) 190 Hz denotes the RUNNING-SPEECH median (genome measured_f0_median_hz: 190.9), not the contour base. Calibrated build_f0_track base so the ten-sentence rendered median lands 191.4 Hz vs 190.9 target (was 184.2). Also fixed phrase_end using segments[-1].t1 (out-of-order bug). HEARING measure_render now reports f0_median/f0_p05/f0_p95 alongside legacy f0 mean; Gate 2's f0 check now uses the true median and the genome target. (E4) ANCHOR FORK: option B, anchors DESCRIBE the contour; the procedural track is the source of truth. The old f0_anchor_tracking check compared track to stale absolute anchors, neither touching audio (Zar §2.8). Replaced with audio_track_fidelity, which measures rendered AUDIO F0 vs the plan track at anchor times (audio vs plan). It passes at 1.27% and PROVABLY fails at 6.64% when audio is detuned 8%. No acoustic parameter changed by the E4 ruling. The F0 base calibration is derived from the genome's stated semantics, not a new identity choice." }

  - { version: 0.3.10-round13-wiring, date: 2026-11-18, by: Narusya,
      note: "ROUND 13 remaining cheap items. Style effort sentinel 0.5 -> None so explicit effort=0.5 is no longer overwritten by register presets (proved both directions). LF alpha frame renderer now uses phase1's verified full zero-DC solution with wide bracket; alpha now varies across the Rd/F0 grid (was silently -10.0 everywhere) and matches phase1's -628.3 at Rd1.25/F0190. Aperiodicity mask smoothing now a real 5ms crossfade instead of a discarded hard threshold. Consonant synthesis failures now recorded in provenance.dropped_consonants and golden-asserted none (guard proved to fire). Vendored real CMUdict with stress digits + noun/verb variants into lexicon/cmudict.dict (135k entries, permissive CMU source); stress no longer 100% algorithmic, 'record' noun/verb now contrast, 'today'/'fox' stress from dictionary. Dict/override/handling paths resolved relative to module for fresh-clone portability. Phrase-final lengthening moved into the live planner with correct last-vowel logic; fixed a shift bug that moved appended silences and broke pause silence (golden 10/10). No acoustic identity parameter changed; F0 median moved to 190.65 via correct dictionary stress." }

  - { version: 0.3.11-tilt-ruling, date: 2026-11-18, by: Narusya,
      note: "TILT RULING (Round 13 E2, ears gate). Speech PSD tilt is INFORMATIONAL, not an identity veto. Justification (CORRECTED Round 14): the 100-4000 Hz speech PSD slope is formant/harmonic-dominated (per-sentence -2.7..-8.0 on a stable source) and is not a clean brightness knob, so it cannot carry an identity gate on speech. The -1.30 target belongs to the SOURCE and must be verified on a controlled carrier, not a speech median. Zar measured the steady-schwa source at -4.45 dB/oct (raw) / -5.86 (post-stage): ~3.15 dB/oct darker than target, the real gap to close. ERRATUM: the earlier version of this entry claimed brightening dropped HEARING's canonical composite 0.815->0.505. That was a CLIPPING ARTIFACT (uncommitted cascade peaked 2.26; int16 conversion without normalization destroyed MFCC 0.93->0.145). With peak normalization the composite RISES 0.815->0.953, reproduced by Zar. No acoustic parameter changed: apply_fixed_tilt untouched; gate2_speech.py reports tilt informational:true, pass:true. Gate 2 PASS on four sound checks. Open: source-level tilt target on a controlled carrier." }

  - { version: 0.3.12-round14, date: 2026-11-18, by: Narusya,
      note: "ROUND 14 response to Zarza. ERRATUM recorded in 0.3.11: the composite-drop evidence was a clipping artifact (int16 conversion of a 2.26-peak cascade), not brightening breaking MFCC. Zar reproduced composite rising 0.815->0.953 with normalization; I verified the same. Ruling stands on the formant-dominance argument, not the retracted evidence. Q1: removed the fitted 0.988 F0 scalar. build_f0_track now reads measured_f0_median_hz from the genome (was hardcoded 190.0) and derives base per-utterance from the unit-base contour's voiced-frame median. Calibration happens BEFORE the question rise, with the rise region excluded from the median, so the rise stays a signal (question last-100ms 226.5Hz vs statement 181.2Hz). Statements now median 190.6, questions no longer overshoot as an artifact of the scalar. Q2: audio_track_fidelity now probes voiced-segment quartiles across the whole utterance (was only 2 late anchors at 78%/86%), with a 60%-voiced majority guard so silence still fails and a partial subset cannot sneak through. Verified: normal 0.11%, detune+8% fires 7.4%, silence None. Housekeeping: HEARING path via env/sibling checkout (no hardcoded /home/adora), removed dead SUB_LEVEL_TARGET, fixed stale docstring, sub_bass_levels sized from max(s.t1). Golden 10/10, Gate 2 PASS on four checks." }

  - { version: 0.3.13-gate3-scaffold, date: 2026-11-18, by: Narusya,
      note: "GATE 3 SCAFFOLDING built. Added optional overrides to render_plan_v3 (f0_target, f3_scale, rd, effect_scale) and build_f0_track (f0_target), and f3_scale to apply_transitions so the F3 perturbation survives the transition blend (found and fixed a silent no-op there). gate3_identity.py renders the genome against graded perturbations of all four veto families (F0 +/-10, F3 +/-5%, Rd, effect depth) plus Zarza's combined corner, measures composite perceptual distance via HEARING, and emits 18 WAVs for Adora's A/B/X. Sensitivity gate PASS: base_vs_base 0.0000, all three identity families clear the 0.02 JND floor (F0 max 0.055, F3 max 0.067, Rd max 0.059), corner 0.139 dominates (2x any family). Sub-bass alone peaks 0.019 below floor — a -37 dB purr by design, REPORTED NOT GATED; do not lower the floor to force it. This is NOT a listening verdict: the identity question belongs to Adora by invitation. No genome identity parameter changed." }

  - { version: 0.3.14-gate1, date: 2026-11-19, by: Narusya,
      note: "GATE 1 (intelligibility) BUILT AND FAILING. Adora ruled the genome clip 'not speech, indistinguishable from noise'; human verdict overrides machine (calibration logged in HEARING 32bae8a). Independent oracle faster-whisper-base (never seen the genome, confirmed transcribing real speech) scores WER 1.0 on 4 golden sentences — the render is not intelligible. ROOT CAUSES found: (1) LF source has DC offset 0.106 (46% of RMS); (2) parallel formant bank used all-pole b=[1] resonators, so DC leaked through all four summed branches and drowned F2/F3. Changed resonator_coeffs to a DC/Nyquist bandpass with peak normalization — correct physics, but Gate 1 STILL FAILS, so it is NOT claimed as a fix. Golden set still 10/10, which is itself the circularity evidence: structural/circular checks pass while independent ASR fails. gate1_intelligibility.py is the new fail-able gate; all perceptual scores are now informative-only until Gate 1 passes. Do not present composite/MFCC numbers as progress." }

  - { version: 0.3.15-round15, date: 2026-11-19, by: Narusya,
      note: "ROUND 15 (Zarza): primary Q2 mechanism FIXED. resonator_coeffs was bandpass but peak gain was 1/|den(w0)| — 1630x at F1 450Hz vs 394x at F2 1500Hz, amplifying F1 ~4x and drowning vowel identity. Replaced with analytic UNITY peak gain (measured 1.001/1.000/1.000; DC 0). F2-band energy on 'This is the moon' went 2.24% -> 20.41% (real speech min 3.12), and all four golden renders now PASS HEARING speech-presence. Gate 1 WER still 1.0 — WHisper now hears speech-shaped words ('What the fuck is the name?') instead of silence, but not the target. NOT intelligible yet; do not claim Gate 1 pass. SECONDARY LEVERS TESTED AND REJECTED on the full utterance: aspiration noise (genome knob now wired, level_db -120 = OFF) lowered F2 20.4->16.3% and inflated entropy 5.7->7.7; bandwidth widening x1.3/x2/x3 lowered F2 20.4->17.7/15.1/14.4%. Zarza's diagnostics helped isolated /a/ but hurt running speech; kept only the gain fix. Genome bandwidth_widening 1.3 remains unused (declared-but-unwired; no change). Structural golden 10/10 means STRUCTURALLY WELL-FORMED, never '10/10 speech'." }

  - { version: 0.3.16-round16, date: 2026-11-19, by: Narusya,
      note: "ROUND 16 (Zarza mechanism review, independently verified by Narusya): the intelligibility wall was a UNIT MISMATCH, not an acoustic-design dead end. coarticulation.cv_transition/vc_transition computed n_frames = duration_ms*sr/1000/10 — dividing by 10 SAMPLES (0.208ms), not 10ms — returning 241 frames for a 50ms transition at 48kHz. time_varying.apply_transitions assumes 10ms/frame (trans_duration = n_trans*0.01), so it wrote the transition across 2.41s: a 48.2x stretch. Every vowel was rendered as a slow consonant-locus->target glide and NEVER reached steady state. Verified by my own runs: baseline stretch 48.2x; /u/ F2 trajectory 975->1150->1200->1450->1425 Hz (swept into /ʌ/ territory, which is exactly why Whisper heard moon as But); /i/ midpoint off target. FIX (one line, both functions): n_frames = max(1, int(round(duration_ms/10.0))) — producer matches the consumer's documented 10ms contract. NO genome acoustic parameter changed; this is a bug fix, not an identity choice. AFTER FIX (my runs): written extent 60ms for 50ms requested (1.2x, the +1 steady-state frame); /u/ midpoint F2=800 (target 800), /i/ midpoint F2=2400 (target 2350). Gate 1 0/4 -> 1/4: 'This is the moon.' transcribes EXACTLY (WER 0.0); golden mean WER 1.0 -> 0.6875. Golden structural still 10/10. Regression guard added: tests/test_transition_timebase.py asserts producer/consumer extent agreement AND vowel-midpoint steady state (broad peak search), verified to fire on the old formula. MEASUREMENT ERRATUM: my earlier ±15% target-window peak search MASKED the sweep (it reported /u/ F2~750 because it only looked near 800 and found residual energy); the correct instrument is a broad peak search / full formant-track trace, which exposes the glide. REMAINING (Zarza priority 2-6, NOT yet done): /i/ F1 harmonic starvation (F1=300 sits between H1=190 and H2=380, outside bw80, so F1 gets almost no excitation; sustained /i/ F2/F3 +54dB over F1); per-formant gains as a genome field calibrated on FULL-utterance renders after the transition fix (isolated-vowel calibration is a mirage); aspiration re-evaluated on WER + peak prominence, NOT band-energy fraction (the Round 15 rejection was metric-driven — the fraction is a ratio that falls when broadband noise adds energy elsewhere); stop-burst coarticulation (synthesize_stop accepts following_vowel_formants but never uses it; dispatcher never passes it); LF zero-DC correctness (one cycle integrates +5.95e-4, x190 = DC 0.113; blocked downstream by DC-zero resonators + radiation diff, so housekeeping not the wall). TILT RULED OUT IN BOTH DIRECTIONS: my EQ brightening (centroid 955->2266Hz) and Zarza's darkening (-4/-8/-12 dB/oct) both fail to fix WER; a global slope cannot correct opposite vowel-specific defects. Gate 1 WER on the independent oracle remains the absolute floor; no composite/structural score is progress. Credit Zarza (fresh clones at 3fb3fc2/a0d1ff9, monkeypatch-only, hands off my tree and my ruling). Perceptual ruling stays mine." }
